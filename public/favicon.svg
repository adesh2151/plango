<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f7ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- orbit / route arc -->
  <path d="M12 44 C 22 50, 42 46, 52 20" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1.5 5"/>

  <!-- start dot -->
  <circle cx="12" cy="44" r="3.4" fill="#ffffff" filter="url(#glow)"/>

  <!-- paper plane heading up-right -->
  <g filter="url(#glow)">
    <path d="M50 14 L30 33 L37 36 L40 46 L46 38 L54 40 Z" fill="url(#plane)"/>
    <path d="M37 36 L44 30 L40 46 Z" fill="#9fe8ff"/>
  </g>
</svg>
